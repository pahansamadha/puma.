        /* Password Screen Styling */
        .password-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 0, 16, 0.65);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .password-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .pass-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 35px 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 51, 133, 0.4);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
            text-align: center;
            max-width: 320px;
            width: 90%;
        }

        .pass-title {
            color: #ff5e97;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .pass-input {
            width: 100%;
            padding: 12px;
            font-size: 22px;
            text-align: center;
            letter-spacing: 10px;
            border-radius: 12px;
            border: 2px solid #ff3385;
            background: rgba(0, 0, 0, 0.5);
            color: #ffffff;
            outline: none;
            margin-bottom: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .pass-input::placeholder {
            letter-spacing: normal;
            font-size: 14px;
            color: #888;
        }

        .pass-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #ff007f, #ff5e97);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            transition: transform 0.2s;
        }

        .pass-btn:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: #ff3333;
            font-size: 13px;
            margin-top: 10px;
            min-height: 18px;
        }

        /* Background Effects Canvas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* Animation Container */
        .container {
            position: relative;
            width: 400px;
            height: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }

        #heartCanvas {
            background: rgba(17, 2, 24, 0.75);
            backdrop-filter: blur(8px);
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.4);
            border-radius: 20px;
            border: 1px solid rgba(255, 51, 133, 0.3);
            width: 100%;
            height: 100%;
        }

        /* Touch Button Styling */
        .touch-btn {
            position: absolute;
            bottom: 30px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff007f, #ff5e97);
            border: none;
            border-radius: 25px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
            cursor: pointer;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease-in-out;
            pointer-events: none;
            z-index: 10;
        }

        .touch-btn.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(255, 0, 127, 0.6); }
            50% { box-shadow: 0 0 25px rgba(255, 0, 127, 0.9); transform: scale(1.05); }
            100% { box-shadow: 0 0 15px rgba(255, 0, 127, 0.6); transform: scale(1); }
        }

        /* Watch & Exit Action Container */
        .action-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 85%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
            z-index: 15;
        }

        .action-container.show {
            opacity: 1;
            pointer-events: auto;
        }

        .watch-btn {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff0055, #ff5e97);
            border: 2px solid #ffffff;
            border-radius: 30px;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
            cursor: pointer;
            text-align: center;
            animation: pulse 1.2s infinite;
        }

        .exit-btn {
            width: 60%;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            color: #ffd1e8;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            cursor: pointer;
            text-align: center;
            transition: background 0.3s;
        }

        .exit-btn:hover {
            background: rgba(255, 0, 85, 0.4);
        }

        /* Modal / Message Popup Box */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 20;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: linear-gradient(135deg, rgba(42, 8, 53, 0.95), rgba(66, 10, 82, 0.95));
            padding: 25px 20px;
            border-radius: 18px;
            text-align: center;
            border: 2px solid #ff3385;
            box-shadow: 0 0 25px rgba(255, 51, 133, 0.8);
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 85%;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-msg {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px #ff007f;
            margin-bottom: 12px;
        }

        /* Small Font Subtext Styling */
        .modal-subtext {
            font-size: 13px;
            color: #ffd1e8;
            line-height: 1.6;
            margin-bottom: 18px;
            text-shadow: 0 0 5px rgba(255, 105, 180, 0.5);
            max-height: 250px;
            overflow-y: auto;
            text-align: justify;
            padding: 0 5px;
            min-height: 100px;
            word-wrap: break-word;
        }

        .close-btn {
            background: #ff007f;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        /* Birthday Wish Popup Effect */
        .wish-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(42, 8, 53, 0.95);
            padding: 25px 30px;
            border-radius: 20px;
            border: 2px solid #ff3385;
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.9);
            color: #ffd1e8;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 12px #ff007f;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-out, transform 1.5s ease-out;
            max-width: 85%;
            word-wrap: break-word;
        }

        .wish-popup.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .wish-popup.fade-out {
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* Exit Screen Messages */
        .exit-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 0, 16, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            padding: 20px;
            text-align: center;
        }

        .exit-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .exit-text-container {
            max-width: 350px;
            color: #ffd1e8;
            font-size: 16px;
            line-height: 1.8;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.7);
        }

        .exit-line {
            margin-bottom: 12px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .exit-line.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Blurred Photo Background Layer -->
    <div class="bg-image-container"></div>

    <!-- Background Audio Elements for Compatibility -->
    <audio id="bgMusic" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
        <source src="song.mp3.mp3" type="audio/mpeg">
        <source src="0824.MP3" type="audio/mpeg">
    </audio>

    <!-- Background Animation Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Password Screen Overlay -->
    <div class="password-screen" id="passScreen">
        <div class="pass-box">
            <div class="pass-title">Enter Password 🔒</div>
            <input type="password" id="passInput" class="pass-input" maxlength="4" placeholder="****" pattern="[0-9]*" inputmode="numeric">
            <button class="pass-btn" onclick="checkPassword()">Unlock ❤️</button>
            <div class="error-msg" id="errorMsg"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <canvas id="heartCanvas" width="400" height="520"></canvas>
        
        <!-- Touch Button -->
        <button class="touch-btn" id="touchBtn" onclick="showMessage()">Touch Me ✨</button>

        <!-- Watch & Exit Buttons Container -->
        <div class="action-container" id="actionContainer">
            <button class="watch-btn" onclick="showNextScreen()">If you are going to watch it, watch it.</button>
            <button class="exit-btn" onclick="exitPage()">Exit ✖</button>
        </div>

        <!-- Message Popup -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-box">
                <div class="modal-msg" id="modalTitle">I Love You ❤️</div>
                <div class="modal-subtext" id="modalText"></div>
                <button class="close-btn" id="modalCloseBtn" onclick="hideMessage()">Close</button>
            </div>
        </div>
    </div>

    <!-- Birthday Wish Banner -->
    <div class="wish-popup" id="wishPopup">
        I WISH MANY HAPPY RETURNS FOR YOU 17 BIRTHDAY 🎂🎁❤️
    </div>

    <!-- Exit Screen Messages -->
    <div class="exit-screen" id="exitScreen">
        <div class="exit-text-container" id="exitTextContainer">
            <div class="exit-line">You are valuable to me.</div>
            <div class="exit-line">I trust you.</div>
            <div class="exit-line">I respect you.</div>
            <div class="exit-line">I believe those things.</div>
            <div class="exit-line">Don't ever let that trust be broken, baby.</div>
            <div class="exit-line">No matter how much you scold me, I still consider you mine.</div>
            <div class="exit-line" style="color: #ff3385; font-size: 20px; margin-top: 15px;">love my princess 👑❤️</div>
        </div>
    </div>

    <script>
        const CORRECT_PASS = "0926";
        const fullMessageText = "my babyta subama suba upan dinayak wenna one.man meka hadanne 2026.08.22 mee weddi nam oya math ekka tharaha wela wachanayak wath katha nokata masa 3k withara.eth mata oyawa hithen atharinna ba baby.oya meka dakiddi api dennna kalin hitiya wagema innath puluwan.man hamadama parthana karanne eeka. eka oyage kamaththa.monawa unath parissamin sathutin inna one hamadaamath.man oyaata adareyi godariyak.eka ane manda mata wachana walin kiyala nima karanna nam bari weyi.sathutin inna onee hamadaamath oyata man godaaariyak adareyi manikaa.... I LOVE YOUU BABY";

        let typeInterval;
        let isSecondScreen = false;

        // Music play function
        function playMusic() {
            const music = document.getElementById('bgMusic');
            if (music) {
                music.play().catch(e => console.log("Audio play error:", e));
            }
        }

        function checkPassword() {
            const inputVal = document.getElementById('passInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (inputVal === CORRECT_PASS) {
                playMusic(); // Password අගුල අරිනවිට සිංදුව ආරම්භ වේ
                document.getElementById('passScreen').classList.add('hidden');
                startAnimation();
            } else {
                errorMsg.innerText = "Wrong Password! Try again ❌";
                document.getElementById('passInput').value = "";
            }
        }

        document.getElementById('passInput').addEventListener('keyup', function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });

        /* --- Background Animation Canvas Setup --- */
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');

        function resizeBgCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        resizeBgCanvas();
        window.addEventListener('resize', resizeBgCanvas);

        const flowers = [];
        const flowerPetals = ['🌸', '🌺', '🌷', '🌹', '✨'];
        for (let i = 0; i < 30; i++) {
            flowers.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 18 + 12,
                speedY: Math.random() * 1.5 + 0.8,
                speedX: Math.sin(Math.random() * Math.PI) * 0.8,
                symbol: flowerPetals[Math.floor(Math.random() * flowerPetals.length)],
                rotation: Math.random() * 360,
                rotSpeed: (Math.random() - 0.5) * 2
            });
        }

        const balloons = [];
        const balloonColors = ['#ff4d88', '#ff769c', '#ff0055', '#ff99c8', '#e056fd', '#ffbe76'];
        for (let i = 0; i < 18; i++) {
            balloons.push({
                x: Math.random() * window.innerWidth,
                y: window.innerHeight + Math.random() * 500,
                radius: Math.random() * 14 + 16,
                speedY: Math.random() * 1.2 + 0.8,
                swing: Math.random() * 2,
                swingSpeed: Math.random() * 0.02 + 0.01,
                color: balloonColors[Math.floor(Math.random() * balloonColors.length)]
            });
        }

        function animateBackground() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

            balloons.forEach(b => {
                b.y -= b.speedY;
                b.swing += b.swingSpeed;
                const currentX = b.x + Math.sin(b.swing) * 15;

                bgCtx.save();
                bgCtx.beginPath();
                bgCtx.arc(currentX, b.y, b.radius, 0, Math.PI * 2);
                bgCtx.fillStyle = b.color;
                bgCtx.shadowBlur = 10;
                bgCtx.shadowColor = b.color;
                bgCtx.fill();

                bgCtx.beginPath();
                bgCtx.moveTo(currentX - 3, b.y + b.radius);
                bgCtx.lineTo(currentX + 3, b.y + b.radius);
                bgCtx.lineTo(currentX, b.y + b.radius + 5);
                bgCtx.fillStyle = b.color;
                bgCtx.fill();

                bgCtx.beginPath();
                bgCtx.moveTo(currentX, b.y + b.radius + 5);
                bgCtx.lineTo(currentX, b.y + b.radius + 25);
                bgCtx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                bgCtx.lineWidth = 1;
                bgCtx.stroke();
                bgCtx.restore();

                if (b.y < -50) {
                    b.y = bgCanvas.height + 50;
                    b.x = Math.random() * bgCanvas.width;
                }
            });

            flowers.forEach(f => {
                f.y += f.speedY;
                f.x += Math.sin(f.y * 0.02) * 0.8;
                f.rotation += f.rotSpeed;

                bgCtx.save();
                bgCtx.translate(f.x, f.y);
                bgCtx.rotate((f.rotation * Math.PI) / 180);
                bgCtx.font = `${f.size}px serif`;
                bgCtx.textAlign = 'center';
                bgCtx.textBaseline = 'middle';
                bgCtx.fillText(f.symbol, 0, 0);
                bgCtx.restore();

                if (f.y > bgCanvas.height + 20) {
                    f.y = -20;
                    f.x = Math.random() * bgCanvas.width;
                }
            });

            requestAnimationFrame(animateBackground);
        }

        animateBackground();

        /* --- Heart Canvas --- */
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2 - 40;

        const particles = [];
        const heartPoints = [];
        let isDispersing = false;
        let animationStarted = false;

        for (let angle = 0; angle < Math.PI * 2; angle += 0.03) {
            const x = 16 * Math.pow(Math.sin(angle), 3);
            const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
            heartPoints.push({
                x: centerX + x * 8,
                y: centerY + y * 8
            });
        }

        class Particle {
            constructor(targetX, targetY, delay) {
                this.x = targetX + (Math.random() - 0.5) * 20;
                this.y = targetY + (Math.random() - 0.5) * 20;
                this.targetX = targetX;
                this.targetY = targetY;
                this.size = Math.random() * 2 + 1;
                this.color = `hsl(${330 + Math.random() * 20}, 100%, ${60 + Math.random() * 20}%)`;
                this.alpha = 0;
                this.delay = delay;
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = (Math.random() - 0.5) * 3 - 1;
            }

            draw() {
                if (!isDispersing) {
                    if (this.delay > 0) {
                        this.delay--;
                        return;
                    }
                    if (this.alpha < 1) this.alpha += 0.06;
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.alpha > 0) this.alpha -= 0.02;
                }

                if (this.alpha <= 0) return;

                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ff1493';
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        heartPoints.forEach((pt, index) => {
            particles.push(new Particle(pt.x, pt.y, index * 0.4));
        });

        let textAlpha = 0;
        function drawText() {
            if (!isDispersing) {
                if (textAlpha < 1) textAlpha += 0.04;
            } else {
                if (textAlpha > 0) textAlpha -= 0.03;
            }

            if (textAlpha <= 0) return;

            ctx.save();
            ctx.globalAlpha = Math.max(0, textAlpha);
            ctx.font = 'bold 22px "Segoe UI", sans-serif';
            ctx.fillStyle = '#ff3385';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff0066';
            ctx.fillText('Happy Birthday Lithmii', centerX, height - 100);
            ctx.restore();
        }

        const totalAnimationSteps = heartPoints.length * 0.4 + 20;
        let frame = 0;
        let touchBtnShowed = false;

        function animate() {
            if (!animationStarted) return;

            ctx.fillStyle = 'rgba(13, 0, 16, 0.3)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => p.draw());

            frame++;

            if (frame > heartPoints.length * 0.3) {
                drawText();
            }

            if (frame > totalAnimationSteps && !touchBtnShowed) {
                touchBtnShowed = true;
                document.getElementById('touchBtn').classList.add('show');
            }

            requestAnimationFrame(animate);
        }

        function startAnimation() {
            animationStarted = true;
            animate();
        }

        function typeWriterText(text, elementId, chunkSize = 4) {
            const element = document.getElementById(elementId);
            element.innerHTML = "";
            let index = 0;
            clearInterval(typeInterval);

            typeInterval = setInterval(() => {
                if (index < text.length) {
                    element.innerHTML += text.substr(index, chunkSize);
                    index += chunkSize;
                    element.scrollTop = element.scrollHeight;
                } else {
                    clearInterval(typeInterval);
                }
            }, 10);
        }

        function showMessage() {
            playMusic();
            isSecondScreen = false;
            document.getElementById('modalTitle').innerText = "I Love You ❤️";
            document.getElementById('modalOverlay').classList.add('active');
            typeWriterText(fullMessageText, 'modalText', 4);
        }

        function hideMessage() {
            clearInterval(typeInterval);
            document.getElementById('modalOverlay').classList.remove('active');

            if (isSecondScreen) {
                const wishPopup = document.getElementById('wishPopup');
                wishPopup.classList.add('show');

                setTimeout(() => {
                    wishPopup.classList.add('fade-out');
                }, 2500);

                setTimeout(() => {
                    wishPopup.classList.remove('show', 'fade-out');
                }, 4000);

            } else {
                document.getElementById('touchBtn').style.opacity = '0';
                document.getElementById('touchBtn').style.pointerEvents = 'none';
                isDispersing = true;

                setTimeout(() => {
                    document.getElementById('actionContainer').classList.add('show');
                }, 1000);
            }
        }

        function showNextScreen() {
            isSecondScreen = true;
            clearInterval(typeInterval);
            document.getElementById('modalTitle').innerText = "✨";
            document.getElementById('modalText').innerHTML = "<div style='text-align: center;'><h2 style='font-size: 20px; font-weight: bold; color: #ff3385; margin-bottom: 8px; text-shadow: 0 0 10px #ff007f;'>my princess</h2><p style='font-size: 16px; font-weight: bold; color: #ffd1e8; text-shadow: 0 0 8px rgba(255, 105, 180, 0.8);'>oya hithan hitiyata hama pirimiyama ekayi kiyala ehema nathi wennath puluwan harida..man oya ahuwahama eda eka paratama kamathi nokiuwe lajjawata misak kamathi nathuwa nemeyi haridaa.mama ahanna kalin ahuwa kiyala man monawa karannada.oya hithanawanam man oyata adareyi kiuwe boruwata kiyala eeka waradii hodee... man oyaata godariyak adareyi babyy.oya mata banapu dawase man eka eka ewa kiuwata sorryy man eda oyath ekka chat karanakotath hitiye policeye 😪 police jeep ekath ekka rees thiyanna gihin😁.ewa dan wadak na.. eda man eka eka ewa kiuwataanam sorry hode.adareyi mege pana 🌍💍🥰hamadamath sathutin parissaminn inna onee. amma ekka wali daa ganna epa hodee..aa thawa deyak eda natum tharaga walata gihin apu dawase man kelloth ekka hathara watee awiddeth na hode oya mee mata ehema eda kiuwata eke kolloth giya haridaa man hitiye un ekka misak kello ekka neme hodeeee.anika mata wena kellek onenam dan melahata hoyagena oyawama mata one misak mata wena kello ekekwath wadak na hodeeeeee.love you....</p></div>";
            document.getElementById('modalOverlay').classList.add('active');
        }

        function exitPage() {
            const exitScreen = document.getElementById('exitScreen');
            const lines = document.querySelectorAll('.exit-line');
            
            exitScreen.classList.add('active');

            lines.forEach((line, index) => {
                setTimeout(() => {
                    line.classList.add('show');
                }, (index + 1) * 700);
            });

            const totalDelay = (lines.length + 1) * 700 + 3000;
            setTimeout(() => {
                document.body.style.transition = "opacity 1.5s ease";
                document.body.style.opacity = "0";
                
                setTimeout(() => {
                    window.location.reload();
                }, 1500);
            }, totalDelay);
        }
    </script>
</body>
